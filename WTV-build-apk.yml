name: Build WTV APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'WTV-projeto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android project
        run: |
          if [ -f WTV-projeto.zip ]; then
            unzip -o WTV-projeto.zip -d .
          elif [ -f wtv-projeto.zip ]; then
            unzip -o wtv-projeto.zip -d .
          else
            echo 'WTV-projeto.zip was not found in the repository root.'
            exit 1
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p WTV assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTV-APK
          path: WTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
